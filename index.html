<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rohit Quotes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    justify-content: center;
    padding: 50px 20px;
    color: #fff;
}

.container {
    max-width: 700px;
    width: 100%;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 28px;
    margin: 0;
    font-weight: 700;
}

.header p {
    font-size: 14px;
    opacity: 0.7;
}

.quote-card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.3);
    transition: transform 0.3s, box-shadow 0.3s;
}

.quote-card:hover {
    transform: scale(1.02);
    box-shadow: 0 15px 50px rgba(0,0,0,0.4);
}

.quote {
    font-size: 22px;
    line-height: 1.5;
    margin-bottom: 12px;
}

.quote .highlight {
    color: #38bdf8;
    font-weight: 700;
}

.author {
    font-size: 16px;
    opacity: 0.8;
    margin-bottom: 5px;
}

.category {
    display: inline-block;
    font-size: 12px;
    background: #0ea5e9;
    color: #000;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
}

.reflection {
    font-size: 14px;
    font-style: italic;
    opacity: 0.85;
    margin-bottom: 15px;
}

button {
    background: #38bdf8;
    color: #000;
    border: none;
    padding: 12px 25px;
    border-radius: 30px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #0ea5e9;
    transform: scale(1.05);
}

footer {
    text-align: center;
    font-size: 12px;
    opacity: 0.5;
    margin-top: 30px;
}

/* Extra: Multiple quote cards for history */
.history {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-top: 20px;
}
.history .quote-card {
    padding: 15px;
    background: rgba(255,255,255,0.05);
    font-size: 14px;
}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Daily Quotes by Rohit</h1>
        <p>Modern reflections for growth & mindset</p>
    </div>

    <div class="quote-card" id="current-quote">
        <div class="quote" id="quote">Loading...</div>
        <div class="author" id="author"></div>
        <div class="category" id="category"></div>
        <div class="reflection" id="reflection"></div>
        <button onclick="showQuote()" id="cta">Next Quote</button>
    </div>

    <div class="history" id="history">
        <!-- Last 2 quotes will appear here -->
    </div>

    <footer>© Rohit Quotes | Share your thoughts on Instagram</footer>
</div>

<script>
const SHEET_URL = "https://opensheet.elk.sh/1ZB0qKyDQJPUCw5WHnalNs6LiDxyau_gS5ZzHaFd_DXM/Sheet1";
let quotes = [];
let historyQuotes = [];

fetch(SHEET_URL)
.then(res => res.json())
.then(data => {
    quotes = data.filter(q => q.Status === "Active");
    showQuote();
})
.catch(err => {
    document.getElementById("quote").innerText = "Failed to load quotes";
    console.error(err);
});

function showQuote() {
    if(!quotes.length) return;
    const q = quotes[Math.floor(Math.random() * quotes.length)];

    // Current quote
    document.getElementById("quote").innerHTML = `"${q.Quote.replace(q.Highlight, `<span class='highlight'>${q.Highlight}</span>`)}"`;
    document.getElementById("author").innerText = `— ${q.Author}`;
    document.getElementById("category").innerText = q.Category;
    document.getElementById("reflection").innerText = q.Reflection;
    document.getElementById("cta").innerText = q.CTA || "Next Quote";

    // Add to history
    historyQuotes.unshift(q);
    if(historyQuotes.length > 2) historyQuotes.pop();

    const historyDiv = document.getElementById("history");
    historyDiv.innerHTML = "";
    historyQuotes.slice(1).forEach(hq => {
        const div = document.createElement("div");
        div.className = "quote-card";
        div.innerHTML = `<div class="quote">"${hq.Quote}"</div>
                         <div class="author">— ${hq.Author}</div>`;
        historyDiv.appendChild(div);
    });
}
</script>

</body>
</html>
